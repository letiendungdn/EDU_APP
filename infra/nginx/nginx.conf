# Lớp 3 — Reverse proxy (Docker Compose / tham chiếu cho K8s Ingress)
# Routing:
#   nihongo.*         → /api, /health → api-gateway | / → nihongo-web (React)
#   auth.*            → Keycloak

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name nihongo.localhost localhost 10.0.2.2;

    client_max_body_size 10m;

    # API + Swagger (trực tiếp tới gateway, không qua Next.js rewrite)
    location /api/ {
        set $gateway_upstream api-gateway:3000;
        proxy_pass http://$gateway_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /health {   # /health, /health/live, /health/ready
        set $gateway_upstream api-gateway:3000;
        proxy_pass http://$gateway_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Android emulator gọi http://10.0.2.2:8080/... (Host = 10.0.2.2) — proxy Keycloak
    # để OIDC discovery/login không cần DNS auth.localhost trên máy ảo.
    location ~ ^/(realms|resources|js|robots\.txt)(/|$) {
        set $keycloak_upstream keycloak:8080;
        proxy_pass http://$keycloak_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host auth.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host auth.localhost;
        proxy_set_header X-Forwarded-Port 8080;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Next.js frontend tiếng Nhật — dùng biến để Docker DNS cập nhật IP sau recreate container
    location / {
        set $nihongo_upstream nihongo-web:5173;
        proxy_pass http://$nihongo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name auth.localhost;

    client_max_body_size 10m;

    location / {
        set $keycloak_upstream keycloak:8080;
        proxy_pass http://$keycloak_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8080;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
