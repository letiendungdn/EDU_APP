name: NihongoEDU
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.edu
  createIntermediateGroups: true
  defaultConfig: Debug

targets:
  NihongoEDU:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NihongoEDU
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.edu.nihongo.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: NihongoEDU/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  NihongoEDU:
    build:
      targets:
        NihongoEDU: all
    run:
      config: Debug
      # Set via Edit Scheme → Run → Environment Variables
      environmentVariables:
        API_BASE_URL:
          value: ""
          isEnabled: false
        GEMINI_API_KEY:
          value: ""
          isEnabled: false
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
