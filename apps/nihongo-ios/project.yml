name: NihongoEDU
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.edu
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  LiveKitClient:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.0.19

targets:
  NihongoEDU:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NihongoEDU
    dependencies:
      - package: LiveKitClient
        product: LiveKit
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.edu.nihongo.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: NihongoEDU/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: NihongoEDU/NihongoEDU.entitlements
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  NihongoEDUTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NihongoEDUTests
    dependencies:
      - target: NihongoEDU
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edu.nihongo.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NihongoEDU.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NihongoEDU"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  NihongoEDU:
    build:
      targets:
        NihongoEDU: all
        NihongoEDUTests: [test]
    run:
      config: Debug
      environmentVariables:
        API_BASE_URL:
          value: ""
          isEnabled: false
        GEMINI_API_KEY:
          value: ""
          isEnabled: false
        KEYCLOAK_URL:
          value: "http://localhost:8080"
          isEnabled: false
        KEYCLOAK_REALM:
          value: "edu-app"
          isEnabled: false
        KEYCLOAK_CLIENT_ID:
          value: "nihongo-mobile"
          isEnabled: false
    test:
      config: Debug
      targets:
        - NihongoEDUTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
