<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Nihongo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f1419;
        color: #e7ecf1;
      }
      main {
        width: min(420px, calc(100% - 48px));
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 650;
      }
      p {
        margin: 0 0 20px;
        line-height: 1.5;
        color: #b7c2cc;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        background: #3d8bfd;
        color: white;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nihongo chưa chạy</h1>
      <p>Cửa sổ này mở web app tại http://localhost:8080. Hãy bật stack Docker rồi thử lại.</p>
      <button type="button" id="retry">Thử lại</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", () => {
        window.nihongoDesktop.retry();
      });
    </script>
  </body>
</html>
