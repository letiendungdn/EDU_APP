<div class="lesson-selector">
  <label for="lesson-select">Chọn bài học:</label>
  <select id="lesson-select" class="select-input" [value]="value" (change)="onSelect($event)">
    @for (lesson of visibleLessons; track lesson.lessonNumber) {
      <option [value]="lesson.lessonNumber">
        {{ labelFor(lesson) }}{{ countSuffix(lesson) }}
      </option>
    }
  </select>
</div>
