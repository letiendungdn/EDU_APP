@if (isAuthScreen()) {
  <div class="auth-layout">
    <main><router-outlet /></main>
  </div>
} @else {
  <div class="app-container" [class.sidebar-collapsed]="sidebarCollapsed()">
    <button
      type="button"
      class="sidebar-toggle"
      (click)="toggleSidebar()"
      [attr.aria-label]="sidebarOpen() ? 'Đóng menu' : 'Mở menu'"
      [attr.aria-expanded]="sidebarOpen()"
    >
      @if (sidebarOpen()) {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <line x1="3" y1="7" x2="21" y2="7" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="17" x2="21" y2="17" />
        </svg>
      }
    </button>

    <div
      class="sidebar-overlay"
      [class.open]="sidebarOpen()"
      (click)="closeSidebar()"
      aria-hidden="true"
    ></div>

    <aside
      class="app-sidebar"
      [class.open]="sidebarOpen()"
      [class.collapsed]="sidebarCollapsed()"
    >
      <div class="app-sidebar__header">
        <a
          routerLink="/"
          class="app-sidebar__logo"
          (click)="closeSidebar()"
          [attr.title]="sidebarCollapsed() ? 'Nihongo' : null"
        >
          <div class="app-sidebar__logo-icon">🇯🇵</div>
          <div class="app-sidebar__brand">
            <div class="app-sidebar__logo-text">Nihongo</div>
            <div class="app-sidebar__logo-sub">Learn Japanese</div>
          </div>
        </a>
        <button
          type="button"
          class="sidebar-collapse-btn"
          (click)="toggleCollapsed()"
          [attr.aria-label]="sidebarCollapsed() ? 'Mở rộng menu' : 'Thu gọn menu'"
          [attr.aria-pressed]="sidebarCollapsed()"
          [attr.title]="sidebarCollapsed() ? 'Mở rộng menu' : 'Thu gọn menu'"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M9 3v18" />
            @if (sidebarCollapsed()) {
              <polyline points="14 8 18 12 14 16" />
            } @else {
              <polyline points="16 8 12 12 16 16" />
            }
          </svg>
        </button>
      </div>

      <nav class="app-sidebar__nav" aria-label="Main navigation">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item"
          (click)="closeSidebar()"
          [attr.title]="sidebarCollapsed() ? 'Trang chủ' : null"
        >
          <span class="nav-item__icon">🏠</span>
          <span class="nav-item__label">Trang chủ</span>
        </a>

        @for (group of navGroups; track group.label) {
          <div class="nav-group" [class.is-collapsed]="isGroupCollapsed(group.label)">
            <button
              type="button"
              class="nav-group__toggle"
              (click)="toggleGroup(group.label)"
              [attr.aria-expanded]="!isGroupCollapsed(group.label)"
            >
              {{ group.label }}
              <span class="nav-group__chevron" aria-hidden="true">▾</span>
            </button>
            @if (!isGroupCollapsed(group.label)) {
              @for (item of group.items; track item.path) {
                <a
                  [routerLink]="item.path"
                  routerLinkActive="active"
                  [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
                  class="nav-item"
                  (click)="closeSidebar()"
                  [attr.title]="sidebarCollapsed() ? item.label : null"
                >
                  <span class="nav-item__icon">{{ item.icon }}</span>
                  <span class="nav-item__label">{{ item.label }}</span>
                </a>
              }
            }
          </div>
        }
      </nav>

      <div class="app-sidebar__bottom">
        <button type="button" class="theme-toggle" (click)="theme.toggle()" aria-label="Đổi chủ đề" title="Đổi chủ đề">
          @if (isDark()) {
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <line x1="12" y1="2" x2="12" y2="4" />
              <line x1="12" y1="20" x2="12" y2="22" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="2" y1="12" x2="4" y2="12" />
              <line x1="20" y1="12" x2="22" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
          } @else {
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          }
          <span class="theme-toggle__label">{{ isDark() ? 'Chế độ sáng' : 'Chế độ tối' }}</span>
        </button>
        <app-english-app-switcher />
        <app-sidebar-auth />
      </div>
    </aside>

    <div
      class="app-content"
      [class.app-content--custom-banner]="banners.bannerUrl()"
      [ngStyle]="banners.contentStyle()"
    >
      <main class="app-main">
        <router-outlet />
      </main>
      <footer class="app-footer">
        <div class="container">
          <p>
            © {{ year }} Nihongo Learn ·
            <a routerLink="/admin/login">Admin</a> ·
            <a href="/api/docs" target="_blank" rel="noreferrer">API</a>
          </p>
        </div>
      </footer>
      <app-page-banner-control />
    </div>
  </div>
}
