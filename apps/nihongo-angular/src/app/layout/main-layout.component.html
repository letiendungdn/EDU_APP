@if (isAuthScreen()) {
  <div class="auth-layout">
    <main><router-outlet /></main>
  </div>
} @else {
  <div class="app-container">
    <button
      type="button"
      class="sidebar-toggle"
      (click)="toggleSidebar()"
      [attr.aria-label]="sidebarOpen() ? 'Đóng menu' : 'Mở menu'"
      [attr.aria-expanded]="sidebarOpen()"
    >
      @if (sidebarOpen()) {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <line x1="3" y1="7" x2="21" y2="7" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="17" x2="21" y2="17" />
        </svg>
      }
    </button>

    <div
      class="sidebar-overlay"
      [class.open]="sidebarOpen()"
      (click)="closeSidebar()"
      aria-hidden="true"
    ></div>

    <aside class="app-sidebar" [class.open]="sidebarOpen()">
      <a routerLink="/" class="app-sidebar__logo" (click)="closeSidebar()">
        <div class="app-sidebar__logo-icon">🇯🇵</div>
        <div>
          <div class="app-sidebar__logo-text">Nihongo</div>
          <div class="app-sidebar__logo-sub">Learn Japanese</div>
        </div>
      </a>

      <nav class="app-sidebar__nav" aria-label="Main navigation">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item"
          (click)="closeSidebar()"
        >
          <span class="nav-item__icon">🏠</span>
          Trang chủ
        </a>

        @for (group of navGroups; track group.label) {
          <div class="nav-group">
            <div class="nav-group__label">{{ group.label }}</div>
            @for (item of group.items; track item.path) {
              <a
                [routerLink]="item.path"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
                class="nav-item"
                (click)="closeSidebar()"
              >
                <span class="nav-item__icon">{{ item.icon }}</span>
                {{ item.label }}
              </a>
            }
          </div>
        }
      </nav>

      <div class="app-sidebar__bottom">
        <button type="button" class="theme-toggle" (click)="theme.toggle()" aria-label="Đổi chủ đề">
          @if (isDark()) {
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <line x1="12" y1="2" x2="12" y2="4" />
              <line x1="12" y1="20" x2="12" y2="22" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="2" y1="12" x2="4" y2="12" />
              <line x1="20" y1="12" x2="22" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
          } @else {
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          }
          <span>{{ isDark() ? 'Chế độ sáng' : 'Chế độ tối' }}</span>
        </button>
        <app-english-app-switcher />
        <app-sidebar-auth />
      </div>
    </aside>

    <div class="app-content">
      <main class="app-main">
        <router-outlet />
      </main>
      <footer class="app-footer">
        <div class="container">
          <p>
            © {{ year }} Nihongo Learn ·
            <a routerLink="/admin/login">Admin</a> ·
            <a href="/api/docs" target="_blank" rel="noreferrer">API</a>
          </p>
        </div>
      </footer>
    </div>
  </div>
}
